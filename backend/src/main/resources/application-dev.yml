spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stockup
    username: stockup
    password: stockup

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: stockup
    password: stockup

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  otp:
    length: 6
    expiry-seconds: 300
    resend-wait-seconds: 60
    max-attempts-per-hour: 5

  jwt:
    issuer: stockup
    access-token-expiry-seconds: 900
    refresh-token-expiry-seconds: 604800
    # Override with JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-secret-key-not-for-production-use-abcdefghijklmnop}

stockup:
  # Grant ADMIN to this account on boot (the user must have signed in once).
  admin:
    email: ${ADMIN_EMAIL:}

  email:
    # `console` prints the OTP to the log instead of emailing — handy locally.
    provider: ${EMAIL_PROVIDER:console}
    base-url: https://api.brevo.com
    # Never commit a real key. Set BREVO_API_KEY in your environment or .env.
    api-key: ${BREVO_API_KEY:}
    sender-email: ${EMAIL_SENDER:noreply@stockup.local}
    sender-name: StockUp