spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stockup
    username: stockup
    password: stockup

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: stockup
    password: stockup

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  otp:
    length: 6
    expiry-seconds: 300
    resend-wait-seconds: 60
    max-attempts-per-hour: 5

  jwt:
    issuer: stockup
    access-token-expiry-seconds: 900
    refresh-token-expiry-seconds: 604800
    # Override with JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-secret-key-not-for-production-use-abcdefghijklmnop}

stockup:
  # ---- Bharosa (Kasauti engine) -------------------------------------------
  # Every constant is tunable here; none is hardcoded in Java. Retuning trust
  # is an edit to this block and a restart.
  bharosa:
    window-days: 90
    half-life-days: 30          # an event loses half its weight in a month
    prior: 0.62                 # where an unproven shop sits
    prior-strength: 6           # how much evidence to overcome it
    per-customer-cap: 3         # one shopper cannot become a reputation
    consistency-floor: 0.85     # erratic discounts, never destroys
    trajectory-clamp: 0.05      # recent form nudges, never decides
    corroboration-clamp: 0.06   # ratings can move it this far, no further
    fast-response-seconds: 300
    response-window-seconds: 900
    commitment:                 # failing late costs more than failing early
      expired-unseen: 0.5
      viewed-then-expired: 1.5
      offer-submitted: 1.0
      handover-completed: 3.0
      merchant-cancelled: 4.0
      reservation-expired: 5.0
    ranking:
      bharosa-exponent: 1.0
      distance-exponent: 0.6
      availability-exponent: 0.8
      distance-half-life-km: 2.5

  # Grant ADMIN to this account on boot (the user must have signed in once).
  admin:
    email: ${ADMIN_EMAIL:}

  email:
    # `console` prints the login code to the log, so the app always works out
    # of the box. Set EMAIL_PROVIDER=brevo in .env to send real email.
    provider: ${EMAIL_PROVIDER:console}
    base-url: https://api.brevo.com
    # Never commit a real key — this comes from .env (gitignored).
    api-key: ${BREVO_API_KEY:}
    # Must be a sender you have verified in Brevo, or sending is rejected.
    sender-email: ${EMAIL_SENDER:g79844479@gmail.com}
    sender-name: StockUp